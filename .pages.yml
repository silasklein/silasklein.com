            label: Case slug (optional)
            type: string
            description: Fill in only if an art-direction case with this slug exists; the name then links to it.
  - name: projects
    label: 03 Research projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename: '{fields.slug}.md'
    view:
      fields:
        - slug
        - years
      primary: slug
      sort:
        - order
      default:
        sort: order
        order: asc
    fields:
      - name: order
        label: Order
        type: number
        description: 'Position in the list: 1 comes first.'
      - name: slug
        label: Slug (URL)
        type: string
        required: true
        pattern:
          regex: ^[a-z0-9]+(-[a-z0-9]+)*$
          message: Only lowercase letters, numbers and hyphens (e.g. my-new-project).
        description: 'Part of the page address. Do not change it after publishing: old links would break.'
      - name: page
        label: Has its own page
        type: boolean
      - name: current
        label: Current project
        type: boolean
      - name: years
        label: Years
        type: string
      - name: title
        label: Title
        type: object
        fields:
          - name: en
            label: English
            type: string
          - name: pt
            label: Português
            type: string
      - name: role
        label: Role
        type: object
        fields:
          - name: en
            label: English
            type: string
          - name: pt
            label: Português
            type: string
      - name: funding
        label: Funding
        type: string
