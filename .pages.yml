          - name: pt
            label: Português
            type: text
      - name: outputs
        label: Outputs
        type: object
        list: true
        fields:
          - name: en
            label: English
            type: string
          - name: pt
            label: Português
            type: string
  - name: news
    label: News
    type: collection
    path: src/content/news
    format: yaml-frontmatter
    filename: '{fields.slug}.md'
    view:
      fields:
        - title
        - date
        - lang
      primary: title
      sort:
        - date
      default:
        sort: date
        order: desc
    fields:
      - name: slug
        label: Slug (URL)
        type: string
        required: true
        pattern:
          regex: ^[a-z0-9]+(-[a-z0-9]+)*$
          message: Only lowercase letters, numbers and hyphens (e.g. my-new-project).
        description: 'Part of the page address. Do not change it after publishing: old links would break.'
      - name: date
        required: true
        label: Date
        type: date
      - name: lang
        label: Language
        type: select
        options:
          values:
            - en
            - pt
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
        description: Shown in the news list and at the top of the post.
      - name: body
        label: Post text
        type: rich-text
        description: Optional full text, shown below the summary.
