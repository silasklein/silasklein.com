# Pages CMS (app.pagescms.org): the fields the editor shows for each content file. Paths are relative to the repo root.
# The menu mirrors the site's sections. site.json is split across several short screens; `merge` makes each screen
# save only its own fields and keep the rest of the file (and any key the CMS has no field for).
settings:
  content:
    merge: true
media:
  input: public/img
  output: /img

# Reusable fields. A field that uses one can still set its own label and description.
components:
  linha:
    label: Texto curto
    type: object
    fields:
      - name: pt
        label: Português
        type: string
      - name: en
        label: English
        type: string
      - name: es
        label: Español
        type: string
  texto:
    label: Texto
    type: object
    fields:
      - name: pt
        label: Português
        type: text
      - name: en
        label: English
        type: text
      - name: es
        label: Español
        type: text
  slug:
    label: Endereço na web (slug)
    type: string
    required: true
    pattern:
      regex: ^[a-z0-9]+(-[a-z0-9]+)*$
      message: 'Só letras minúsculas, números e hífens (ex.: meu-novo-projeto).'
    description: 'Parte do endereço da página. Não mude depois de publicar: os links antigos quebrariam.'
  ordem:
    label: Posição na lista
    type: number
    description: '1 vem primeiro.'
  icone:
    label: Ícone
    type: select
    description: 'Veja cada ícone ao lado do nome em www.silasklein.com/icons/.'
    options:
      values:
        - arrowRight
        - arrowUpRight
        - arrowDown
        - plus
        - minus
        - mail
        - pin
        - copy
        - download
        - library
        - books
        - star
        - news
        - now
        - field
        - group
        - image
        - university
        - sun
        - eye
        - building
        - calendar
        - community
        - brush
        - pencil
        - layout
        - mic
        - globe
        - presentation
        - instagram
        - linkedin
        - orcid
        - lattes
        - zotero
        - researchgate
        - oub
        - seals
        - epod
        - alef
        - mem
        - het
        - scarab
  tags:
    label: Habilidades (tags)
    type: reference
    required: true
    description: 'De 1 a 5, da mais central para a menos central no projeto. Escolha só da lista; tag nova só com aprovação.'
    options:
      collection: tags
      multiple: true
      min: 1
      max: 5
      search: label_pt
      value: '{fields.slug}'
      label: '{fields.label_pt}'

content:
  # ── Home ─────────────────────────────────────────────
  - name: home
    label: Home
    type: group
    items:
      - name: abertura
        label: Abertura
        type: file
        path: src/content/site.json
        format: json
        fields:
          - name: hello
            label: Saudação
            component: linha
            description: 'Linha magenta acima do título. Ex.: Olá, eu sou Silas Klein.'
          - name: subtitle
            label: Apresentação
            component: texto
            description: Parágrafo abaixo do título, à esquerda.
          - name: facts
            label: Hoje e Campo
            type: object
            description: Os dois itens à direita da apresentação.
            list:
              collapsible:
                collapsed: true
                summary: '{k.pt}'
            fields:
              - name: k
                label: Rótulo
                component: linha
              - name: v
                label: Texto
                component: linha
              - name: icon
                component: icone
          - name: descriptor
            label: Slogan
            component: linha
            description: Aparece no título da aba do navegador e no rodapé.
      - name: sobre
        label: 01 Sobre
        type: file
        path: src/content/site.json
        format: json
        fields:
          - name: bio
            label: Bio · abertura (letra maior)
            component: texto
          - name: bio2
            label: Bio · continuação (letra menor)
            component: texto
          - name: profiles
            label: Perfis (em Sobre e no rodapé)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{name}'
            fields:
              - name: name
                label: Nome
                type: string
              - name: href
                label: Link
                type: string
              - name: icon
                component: icone
      - name: currently
        label: 02 Hoje
        type: file
        path: src/content/currently.json
        format: json
        fields:
          - name: items
            label: Itens
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{title.pt}'
            fields:
              - name: title
                label: Título
                component: linha
              - name: kicker
                label: Linha acima do título
                component: linha
                description: 'Ex.: Plataforma de pesquisa · 2024–'
              - name: text
                label: Texto
                component: texto
              - name: href
                label: Link
                type: string
              - name: icon
                component: icone

  # ── 03 Pesquisa ──────────────────────────────────────
  - name: pesquisa
    label: 03 Pesquisa
    type: group
    items:
      - name: pesquisa-intro
        label: Introdução
        type: file
        path: src/content/site.json
        format: json
        fields:
          - name: researchApproach
            label: Texto de abertura da seção
            component: texto
      - name: projects
        label: Projetos
        type: collection
        path: src/content/projects
        format: yaml-frontmatter
        filename: '{fields.slug}.md'
        view:
          fields:
            - slug
            - years
          primary: slug
          sort:
            - order
          default:
            sort: order
            order: asc
        fields:
          - name: title
            label: Título
            component: linha
          - name: role
            label: Função
            component: linha
          - name: places
            label: Instituições (depois da função)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{name.pt}'
            fields:
              - name: name
                label: 'Nome, ex.: FUV (Brasil)'
                component: linha
              - name: href
                label: Link (opcional)
                type: string
          - name: years
            label: Anos
            type: string
            description: 'Ex.: 2021–2022. Para um projeto em andamento, 2024– (o site completa com “atual”).'
          - name: summary
            label: Resumo
            component: texto
            description: 'Itálico: *assim* (títulos e termos estrangeiros).'
          - name: team
            label: Equipe (opcional)
            component: linha
            description: Aparece na página do projeto.
          - name: outputs
            label: Resultados
            component: linha
            list:
              collapsible:
                collapsed: true
                summary: '{pt}'
          - name: funding
            label: Financiamento
            type: string
          - name: partners
            label: Parceiros
            type: string
          - name: current
            label: Projeto em andamento
            type: boolean
          - name: featured
            label: Nas duas colunas principais
            type: boolean
            description: Projetos que você coordena. Os outros vão para “Outros projetos”.
          - name: page
            label: Tem página própria
            type: boolean
          - name: icon
            label: Ícone (opcional)
            component: icone
          - name: order
            component: ordem
          - name: slug
            component: slug
      - name: recognition
        label: Prêmios
        type: file
        path: src/content/recognition.json
        format: json
        fields:
          - name: items
            label: Prêmios
            component: linha
            list:
              collapsible:
                collapsed: true
                summary: '{pt}'

  # ── 04 Publicações ───────────────────────────────────
  - name: publications
    label: 04 Publicações
    type: file
    path: src/content/publications.json
    format: json
    fields:
      - name: books
        label: Livros
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{title}'
        fields:
          - name: title
            label: Título
            type: string
          - name: meta
            label: Editora · ano
            component: linha
          - name: cover
            label: Capa
            type: image
            description: Só a capa, sem sombra nem fundo (cerca de 385 × 592 px).
          - name: href
            label: Link da editora / DOI
            type: string
          - name: pdf
            label: Link do PDF
            type: string
      - name: selected
        label: Artigos em destaque
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{title}'
        fields:
          - name: title
            label: Título
            type: string
          - name: venue
            label: Revista / livro
            type: string
          - name: href
            label: DOI / link
            type: string
          - name: pdf
            label: Link do PDF
            type: string

  # ── 05 Docência ──────────────────────────────────────
  - name: docencia
    label: 05 Docência
    type: group
    items:
      - name: docencia-intro
        label: Introdução
        type: file
        path: src/content/site.json
        format: json
        fields:
          - name: teaching
            label: Texto de abertura da seção
            component: texto
      - name: outreach
        label: Divulgação
        type: file
        path: src/content/outreach.json
        format: json
        fields:
          - name: items
            label: Itens
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{title.pt}'
            fields:
              - name: title
                label: Título
                component: linha
              - name: text
                label: Texto
                component: texto
              - name: href
                label: Link
                type: string
                description: Endereço externo, ou uma página do site como /talks
              - name: icon
                component: icone
      - name: talks
        label: Entrevistas e palestras
        type: file
        path: src/content/talks.json
        format: json
        fields:
          - name: items
            label: Vídeos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{year} · {title}'
            fields:
              - name: title
                label: Título
                type: string
                required: true
              - name: year
                label: Ano
                type: string
                required: true
              - name: kind
                label: Tipo (Entrevista, Palestra…)
                component: linha
              - name: channel
                label: Canal / evento
                type: string
              - name: lang
                label: Língua do vídeo
                type: select
                options:
                  values:
                    - pt
                    - en
              - name: href
                label: Link do vídeo
                type: string
                required: true

  # ── 06 Iniciativas ───────────────────────────────────
  - name: initiatives
    label: 06 Iniciativas
    type: file
    path: src/content/initiatives.json
    format: json
    fields:
      - name: items
        label: Iniciativas
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{title.pt}'
        fields:
          - name: title
            label: Título
            component: linha
          - name: text
            label: Texto curto (sempre visível)
            component: texto
          - name: details
            label: Descrição (aparece quando a linha é aberta)
            component: texto
          - name: more
            label: Página do site (opcional)
            type: string
            description: 'Ex.: /research/summer-school-iconography'
          - name: href
            label: Link externo (opcional)
            type: string
          - name: icon
            component: icone

  # ── 07 Design ────────────────────────────────────────
  - name: design
    label: 07 Design
    type: group
    items:
      - name: design-intro
        label: Introdução
        type: file
        path: src/content/site.json
        format: json
        fields:
          - name: designIntro
            label: Texto de abertura da seção
            component: texto
      - name: design-research
        label: Itens da home (design para a pesquisa)
        type: collection
        path: src/content/design-research
        format: yaml-frontmatter
        filename: '{fields.slug}.md'
        view:
          fields:
            - slug
            - case
          primary: slug
          sort:
            - order
          default:
            sort: order
            order: asc
        fields:
          - name: title
            label: Título
            component: linha
          - name: text
            label: Texto curto
            component: texto
          - name: case
            label: Página que o item abre
            type: reference
            description: Um dos cases de pesquisa. Nas três línguas, o item da home leva a essa página.
            options:
              collection: research-cases
              search: title
              value: '{fields.slug}'
              label: '{fields.title}'
          - name: icon
            component: icone
          - name: order
            component: ordem
          - name: slug
            component: slug
            description: Nome do arquivo do item. A página que ele abre é a escolhida acima.
      - name: research-cases
        label: Cases de pesquisa
        type: collection
        path: src/content/research-cases
        format: json
        filename: '{fields.slug}.json'
        view:
          fields:
            - title
            - order
          primary: title
          sort:
            - order
          default:
            sort: order
            order: asc
        fields:
          - name: title
            label: Título
            type: string
            required: true
          - name: thesis
            label: Tese (linha magenta abaixo do título)
            component: linha
            description: Um sintagma nominal curto, sem verbo.
          - name: lead
            label: Abertura
            component: texto
            description: 'Itálico: *assim* (títulos e termos estrangeiros). Um endereço como site.org vira link.'
          - name: meta
            label: Ficha (Papel, Cliente, Via, Ano)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{k.pt}'
            fields:
              - name: k
                label: Rótulo
                component: linha
              - name: v
                label: Texto
                component: linha
          - name: hero
            label: Imagem de abertura (sem legenda)
            type: image
            required: true
          - name: hero_alt
            label: Descrição da imagem de abertura, para leitores de tela (opcional)
            component: linha
          - name: context
            label: Contexto (opcional)
            component: texto
            description: 'Itálico: *assim* (títulos e termos estrangeiros). Um endereço como site.org vira link.'
          - name: problem_label
            label: Rótulo do segundo bloco (opcional)
            component: linha
            description: 'Em branco, o bloco se chama Problema. Ex.: Subprojetos.'
          - name: problem
            label: Problema (opcional)
            component: texto
            description: 'Itálico: *assim* (títulos e termos estrangeiros). Um endereço como site.org vira link.'
          - name: decisions
            label: O que fiz (blocos)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{title.pt}'
            fields:
              - name: title
                label: Título
                component: linha
              - name: text
                label: Texto
                component: texto
                description: 'Itálico: *assim* (títulos e termos estrangeiros). Um endereço como site.org vira link.'
              - name: images
                label: Imagens
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{index}. {caption.pt}'
                fields:
                  - name: src
                    label: Imagem
                    type: image
                  - name: caption
                    label: Legenda (a primeira frase sai em negrito)
                    component: texto
                  - name: span
                    label: Largura (colunas, de 12)
                    type: select
                    options:
                      values:
                        - '12'
                        - '7'
                        - '6'
                        - '5'
                        - '4'
                        - '3'
                  - name: plate
                    label: Sobre fundo claro, com respiro (peças impressas)
                    type: boolean
              - name: wide
                label: Imagens na largura toda
                type: boolean
              - name: figures_intro
                label: Frase antes dos números (opcional)
                component: linha
              - name: figures
                label: Números (opcional)
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{n} {label.pt}'
                fields:
                  - name: 'n'
                    label: Número
                    type: string
                  - name: label
                    label: Descrição
                    component: linha
          - name: tags
            component: tags
          - name: order
            component: ordem
            description: 'Posição no anterior/próximo: 1 vem primeiro.'
          - name: slug
            component: slug
            description: 'A página fica em /design/<slug>, /en/design/<slug> e /es/design/<slug>. Não mude depois de publicar: os links antigos quebrariam.'
      - name: cases
        label: Cases de direção de arte
        type: collection
        path: src/content/cases
        format: yaml-frontmatter
        filename: '{fields.slug}.md'
        view:
          fields:
            - title
            - year
          primary: title
          sort:
            - order
          default:
            sort: order
            order: asc
        fields:
          - name: title
            label: Título
            type: string
          - name: text
            label: Texto
            component: texto
          - name: role
            label: Função (opcional)
            component: linha
          - name: team
            label: Equipe (opcional)
            component: linha
          - name: commissioner
            label: Cliente / agência
            type: string
          - name: year
            label: Ano
            type: string
          - name: image
            label: Imagem quadrada (miniatura)
            type: image
            required: true
            description: Pelo menos 1200 × 1200 px. É a miniatura do mosaico da home.
          - name: gallery
            label: Imagens do projeto (em ordem)
            type: object
            description: Aparecem uma abaixo da outra na página do case.
            list:
              collapsible:
                collapsed: true
                summary: '{index}. {alt.pt}'
            fields:
              - name: src
                label: Imagem
                type: image
              - name: alt
                label: Descrição da imagem, para leitores de tela e para o Google (opcional)
                component: linha
                description: 'O que se vê, numa frase. Em branco, o site usa o nome do case e o número da imagem.'
          - name: tags
            component: tags
          - name: mosaic
            label: Mostrar no mosaico da home
            type: boolean
            default: true
            description: 'Desligado, a página e o link na lista de clientes continuam, mas o case sai do mosaico da home.'
          - name: order
            component: ordem
          - name: slug
            component: slug
      - name: clients
        label: Clientes
        type: file
        path: src/content/clients.json
        format: json
        fields:
          - name: items
            label: Clientes
            type: object
            description: A lista do site sai em ordem alfabética em cada língua.
            list:
              collapsible:
                collapsed: true
                summary: '{name}'
            fields:
              - name: name
                label: Nome
                type: string
              - name: name_en
                label: Nome em inglês (opcional)
                type: string
                description: 'Só se o nome em inglês for diferente (ex.: Groupe SEB).'
              - name: name_es
                label: Nome em espanhol (opcional)
                type: string
                description: Só se o nome em espanhol for diferente do inglês. Em branco, usa o nome em inglês.
              - name: slug
                label: Case de direção de arte (opcional)
                type: reference
                description: Se existir um case deste cliente, o nome vira link para ele.
                options:
                  collection: cases
                  search: title
                  value: '{fields.slug}'
                  label: '{fields.title}'

  # ── 08 Contato ───────────────────────────────────────
  - name: contato
    label: 08 Contato
    type: file
    path: src/content/site.json
    format: json
    fields:
      - name: email
        label: E-mail
        type: string
      - name: location
        label: Local
        type: string
      - name: contactTopics
        label: Assuntos de contato
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{label.pt}'
        fields:
          - name: label
            label: Assunto
            component: linha
          - name: email
            label: E-mail (opcional)
            type: string
            description: Em branco, usa o e-mail principal acima.
          - name: icon
            component: icone

  # ── Notícias ─────────────────────────────────────────
  - name: news
    label: Notícias
    type: collection
    path: src/content/news
    format: yaml-frontmatter
    filename: '{fields.slug}.{fields.lang}.md'
    view:
      fields:
        - title
        - date
        - lang
      primary: title
      sort:
        - date
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: summary
        label: Resumo
        type: text
        required: true
        description: Aparece na lista de notícias e no topo do post.
      - name: body
        label: Texto do post (opcional)
        type: rich-text
        description: Aparece abaixo do resumo.
      - name: date
        label: Data
        type: date
        required: true
      - name: lang
        label: Língua
        type: select
        required: true
        options:
          values:
            - pt
            - en
            - es
        description: 'Cada post aparece só no site da sua língua. Para o mesmo post em várias línguas, crie um por língua, com o mesmo endereço (slug).'
      - name: slug
        component: slug

  # ── Ajustes ──────────────────────────────────────────
  - name: ajustes
    label: Ajustes
    type: group
    items:
      - name: sections
        label: Títulos das seções
        type: file
        path: src/content/site.json
        format: json
        fields:
          - name: sections
            label: Seções da home
            type: object
            fields:
              - name: about
                label: 01 Sobre
                type: object
                fields: &section
                  - name: 'n'
                    label: Número
                    type: string
                  - name: label
                    label: Rótulo (minúsculas, ao lado do número)
                    component: linha
                  - name: title
                    label: Título
                    component: linha
              - name: currently
                label: 02 Hoje
                type: object
                fields: *section
              - name: research
                label: 03 Pesquisa
                type: object
                fields: *section
              - name: publications
                label: 04 Publicações
                type: object
                fields: *section
              - name: teaching
                label: 05 Docência
                type: object
                fields: *section
              - name: initiatives
                label: 06 Iniciativas
                type: object
                fields: *section
              - name: design
                label: 07 Design
                type: object
                fields: *section
              - name: contact
                label: 08 Contato
                type: object
                fields: *section
      - name: tags
        label: Tags de habilidade
        type: collection
        path: src/content/tags
        format: json
        filename: '{fields.slug}.json'
        view:
          fields:
            - label_pt
            - slug
          primary: label_pt
          default:
            sort: label_pt
            order: asc
        fields:
          - name: label_pt
            label: Rótulo em português
            type: string
            required: true
            description: Mudar aqui muda o rótulo em todos os projetos.
          - name: label_en
            label: Rótulo em inglês
            type: string
            required: true
          - name: label_es
            label: Rótulo em espanhol
            type: string
          - name: descricao
            label: Nota interna (o que entra na tag)
            type: text
            description: Não aparece no site; serve para escolher a tag certa.
          - name: slug
            component: slug
            description: 'Os projetos guardam a tag por este endereço. Não mude depois de publicar. Tag nova só com a aprovação de Silas.'
