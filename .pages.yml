  - name: tags
    label: Tags de habilidade
    type: collection
    path: src/content/tags
    format: json
    filename: '{fields.slug}.json'
    view:
      fields:
        - label_pt
        - slug
      primary: label_pt
      default:
        sort: label_pt
        order: asc
    fields:
      - name: slug
        label: Slug
        type: string
        required: true
        pattern:
          regex: ^[a-z0-9]+(-[a-z0-9]+)*$
          message: Only lowercase letters, numbers and hyphens.
        description: 'Os projetos guardam a tag por este slug. Não mude depois de publicar. Tag nova só com a aprovação de Silas.'
      - name: label_pt
        label: Rótulo em português
        type: string
        required: true
        description: Mudar aqui muda o rótulo em todos os projetos.
      - name: label_en
        label: Rótulo em inglês
        type: string
        required: true
      - name: label_es
        label: Rótulo em espanhol
        type: string
      - name: descricao
        label: Descrição (o que entra na tag)
        type: text
  - name: news
    label: Blog · notícias
    type: collection
    path: src/content/news
    format: yaml-frontmatter
    filename: '{fields.slug}.{fields.lang}.md'
    view:
      fields:
        - title
        - date
        - lang
      primary: title
      sort:
        - date
      default:
        sort: date
        order: desc
    fields:
      - name: slug
        label: Slug (URL)
        type: string
        required: true
        pattern:
          regex: ^[a-z0-9]+(-[a-z0-9]+)*$
          message: Only lowercase letters, numbers and hyphens (e.g. my-new-project).
        description: 'Part of the page address. Do not change it after publishing: old links would break.'
      - name: date
        required: true
        label: Date
        type: date
      - name: lang
        label: Language
        type: select
        required: true
        options:
          values:
            - pt
            - en
            - es
        description: pt appears only on the Portuguese site, en only on the English site, es only on the Spanish site. For a post in several languages, create one entry per language with the same slug.
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
        description: Shown in the news list and at the top of the post.
      - name: body
        label: Post text
        type: rich-text
        description: Optional full text, shown below the summary.
