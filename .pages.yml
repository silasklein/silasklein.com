  - name: projects
    label: 03 Pesquisa · projetos
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename: '{fields.slug}.md'
    view:
      fields:
        - slug
        - years
      primary: slug
      sort:
        - order
      default:
        sort: order
        order: asc
    fields:
      - name: order
        label: Order
        type: number
        description: 'Position in the list: 1 comes first.'
      - name: slug
        label: Slug (URL)
        type: string
        required: true
        pattern:
          regex: ^[a-z0-9]+(-[a-z0-9]+)*$
          message: Only lowercase letters, numbers and hyphens (e.g. my-new-project).
        description: 'Part of the page address. Do not change it after publishing: old links would break.'
      - name: page
        label: Has its own page
        type: boolean
      - name: current
        label: Current project
        type: boolean
      - name: featured
        label: Show in the two main columns
        type: boolean
        description: Projects you lead. The others go under “Other projects”.
